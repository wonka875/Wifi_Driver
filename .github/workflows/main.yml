name: Build MT7601U Modules

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache clang lld llvm binutils-aarch64-linux-gnu curl flex git libssl-dev libelf-dev python3 zstd

      - name: Download Kernel Source
        run: |
          URL="https://github.com"
          REPO="/aosp-mirror/kernel_common.git"
          git clone --depth=1 -b android12-5.10 "${URL}${REPO}" kernel

      - name: Configure and Build Modules
        run: |
          gunzip -c config.gz > kernel/.config
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          ./scripts/config --enable CONFIG_WLAN
          ./scripts/config --enable CONFIG_WLAN_VENDOR_MEDIATEK
          ./scripts/config --module CONFIG_CFG80211
          ./scripts/config --module CONFIG_MAC80211
          ./scripts/config --module CONFIG_MT7601U
          ./scripts/config --disable CONFIG_MODVERSIONS
          ./scripts/config --disable CONFIG_TRIM_UNUSED_KSYMS
          ./scripts/config --set-str CONFIG_UNUSED_KSYMS_WHITELIST ""
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 modules_prepare
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc) M=net/wireless modules
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc) M=net/mac80211 modules
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 -j$(nproc) M=drivers/net/wireless/mediatek/mt7601u modules
          mkdir -p ../final_modules
          cp net/wireless/cfg80211.ko net/mac80211/mac80211.ko drivers/net/wireless/mediatek/mt7601u/mt7601u.ko ../final_modules/
          ls -lh ../final_modules/

      - name: Upload Built Modules
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-ready
          path: final_modules/*.ko
