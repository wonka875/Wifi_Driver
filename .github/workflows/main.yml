name: Build MT7601U Module Only

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache clang lld llvm binutils-aarch64-linux-gnu curl flex git libssl-dev libelf-dev python3 zstd

      - name: Download Kernel Source
        run: |
          URL="https://github.com"
          REPO="/aosp-mirror/kernel_common.git"
          git clone --depth=1 -b android12-5.10 "${URL}${REPO}" kernel

      - name: Patch and Build MT7601U
        run: |
          gunzip -c config.gz > kernel/.config
          cd kernel
          python3 -c '
          p = "drivers/net/wireless/mediatek/mt7601u/mcu.c"
          s = open(p).read()
          s = s.replace("return firmware_request_cache(dev->dev, MT7601U_FIRMWARE);", "{ const struct firmware *fw; int r = request_firmware(&fw, MT7601U_FIRMWARE, dev->dev); if (!r) release_firmware(fw); return r; }")
          open(p, "w").write(s)
          '
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          sed -i 's/^SUBLEVEL = .*/SUBLEVEL = 226/' Makefile
          ./scripts/config --enable CONFIG_WLAN
          ./scripts/config --enable CONFIG_WLAN_VENDOR_MEDIATEK
          ./scripts/config --module CONFIG_CFG80211
          ./scripts/config --module CONFIG_MAC80211
          ./scripts/config --module CONFIG_MT7601U
          ./scripts/config --enable CONFIG_MODVERSIONS
          ./scripts/config --enable CONFIG_CFI_CLANG
          ./scripts/config --enable CONFIG_CFI_CLANG_SHADOW
          ./scripts/config --disable CONFIG_TRIM_UNUSED_KSYMS
          ./scripts/config --set-str CONFIG_UNUSED_KSYMS_WHITELIST ""
          ./scripts/config --set-str CONFIG_LOCALVERSION "-android12-9-3271afc57"
          ./scripts/config --disable CONFIG_LOCALVERSION_AUTO
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 LOCALVERSION="-android12-9-3271afc57" olddefconfig
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 LOCALVERSION="-android12-9-3271afc57" modules_prepare
          make ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 LOCALVERSION="-android12-9-3271afc57" -j$(nproc) M=drivers/net/wireless/mediatek/mt7601u modules
          mkdir -p ../final_modules
          cp drivers/net/wireless/mediatek/mt7601u/mt7601u.ko ../final_modules/
          llvm-strip --strip-debug ../final_modules/*.ko

      - name: Upload Built Module
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u-fixed
          path: final_modules/mt7601u.ko
